# The Windows zip and Linux AppImage: Run Escape.exe/AppImage, the Electron runtime and the game.
# bun run desktop:dist (Windows) and bun run desktop:dist:linux make them.
# appId and productName don't decide where saves are: that's main.ts.
appId: com.dynrothe.run-escape
productName: Run Escape
directories:
    output: release
# The main process is bundled into desktop/out, so no node_modules ship: the game's dependencies
# are already in dist/, and these would only add to the download.
files:
    - desktop/out/**
    - desktop/splash.html
    - package.json
    - "!node_modules/**"
# Outside the asar, so the game server reads them as plain files. dist/ only: never caches/.
extraResources:
    - from: dist
      to: game
      filter:
          - "**/*"
          - "!**/*.map"
          - "!**/.htaccess"
npmRebuild: false
electronLanguages:
    - en-US
win:
    icon: desktop/icon.png
    target:
        - target: zip
          arch: x64
    artifactName: Run-Escape-${version}-win-${arch}.${ext}
linux:
    icon: desktop/icon.png
    # AppImage only: a single portable file, no distro-specific packaging to maintain.
    target:
        - target: AppImage
          arch: x64
    # ${arch} resolves to x86_64 for AppImage (electron-builder's Linux-arch naming), not x64 as
    # it does for win's zip: hardcoded so both artifacts' names agree with the rest of the release
    # tooling (release.yml, package.json) and with the Windows filename's own x64 convention.
    artifactName: Run-Escape-${version}-linux-x64.${ext}
    category: Game
publish: null
