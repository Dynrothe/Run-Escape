# Builds the desktop release, plus Android when enabled, for a version with no release yet.
# Leaves it as a draft: Dynny publishes it by hand, and only then do players get it. See Desktop in
# docs/DEVELOPMENT.md.
name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            # A token that can only read doesn't see draft releases. Nothing from npm runs here.
            contents: write
        outputs:
            version: ${{ steps.release.outputs.version }}
            build: ${{ steps.release.outputs.build }}
            draft: ${{ steps.release.outputs.draft }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Stop unless this version is new
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  EVENT: ${{ github.event_name }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  state=$(gh release list --limit 1000 --json tagName,isDraft --jq "
                      map(select(.tagName == \"v$version\")) | first |
                      if . == null then \"none\" elif .isDraft then \"draft\" else \"published\" end")
                  echo "v$version: $state"

                  # An unpublished draft is left alone by merges. Running this by hand rebuilds it.
                  build=true
                  if [ "$state" = published ] || { [ "$state" = draft ] && [ "$EVENT" != workflow_dispatch ]; }; then
                      build=false
                  fi

                  {
                      echo "version=$version"
                      echo "build=$build"
                      echo "draft=$([ "$state" = draft ] && echo true || echo false)"
                  } >> "$GITHUB_OUTPUT"

    build:
        needs: check
        if: needs.check.outputs.build == 'true'
        runs-on: windows-latest
        timeout-minutes: 60
        permissions:
            contents: read
        defaults:
            run:
                shell: bash
        steps:
            # Windows checkouts default to CRLF, which the game's shaders and tests aren't written for
            - run: git config --global core.autocrlf false

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Electron needs 22.12 or later, which is more than package.json's engines asks for
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile

            - name: Find the game's cache
              id: game-cache
              run: |
                  name=$(sed -n 's/.*GAME_CACHE_NAME = "\([^"]*\)".*/\1/p' src/game/cache.ts)
                  test -n "$name"
                  echo "name=$name" >> "$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: restore-cache
              with:
                  path: caches
                  key: osrs-cache-${{ steps.game-cache.outputs.name }}

            - name: Download the game's cache
              if: steps.restore-cache.outputs.cache-hit != 'true'
              env:
                  CACHE_NAME: ${{ steps.game-cache.outputs.name }}
              run: |
                  bun run download-caches
                  test -f "caches/$CACHE_NAME/main_file_cache.dat2"
                  test -f caches/caches.json

            # Saved straight away, so a failure further on doesn't mean fetching it from OpenRS2 again
            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.restore-cache.outputs.cache-hit != 'true'
              with:
                  path: caches
                  key: osrs-cache-${{ steps.game-cache.outputs.name }}

            - run: bun run test
            # Where desktop and Android players find co-op: the COOP_URL repository variable,
            # wss://example.com/coop. Without it, the app has no Multiplayer.
            - run: bun run build
              env:
                  VITE_COOP_URL: ${{ vars.COOP_URL }}
                  VITE_RUN_ANALYTICS_URL: ${{ vars.RUN_ANALYTICS_URL }}
                  VITE_CLOUD_SAVE_URL: ${{ vars.CLOUD_SAVE_URL }}
            - run: bun run slim-cache
            # GAME_SITE_URL is the website the app keeps to (https://example.com/game/): without it,
            # the app only takes these releases
            - run: bun run desktop:dist
              env:
                  VITE_COOP_URL: ${{ vars.COOP_URL }}
                  VITE_RUN_ANALYTICS_URL: ${{ vars.RUN_ANALYTICS_URL }}
                  VITE_CLOUD_SAVE_URL: ${{ vars.CLOUD_SAVE_URL }}
                  GAME_SITE_URL: ${{ vars.GAME_SITE_URL }}

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: desktop-release
                  path: |
                      release/Run-Escape-*-win-x64.zip
                      release/game-*.zip
                      release/cache-*.bin
                      release/game-manifest.json
                      release/notes.md
                  if-no-files-found: error
                  retention-days: 1
                  compression-level: 0

    # Uses the same game zip as Windows, so co-op players have the same build id.
    # Enable after setting the persistent signing key: see Android in docs/DEVELOPMENT.md.
    android:
        needs: [check, build]
        if: needs.check.outputs.build == 'true' && vars.ANDROID_RELEASE_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            COOP_URL: ${{ vars.COOP_URL }}
            RUN_ANALYTICS_URL: ${{ vars.RUN_ANALYTICS_URL }}
            CLOUD_SAVE_URL: ${{ vars.CLOUD_SAVE_URL }}
            # The website the app keeps to, as the Windows app does: without it, only these releases
            GAME_SITE_URL: ${{ vars.GAME_SITE_URL }}
            VERSION: ${{ needs.check.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: desktop-release
                  path: release

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun run tsx scripts/android/prepare-game.ts release

            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: 21

            - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
              with:
                  packages: "platforms;android-36 build-tools;36.0.0"
                  log-accepted-android-sdk-licenses: false

            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  gradle-version: "8.13"
                  cache-provider: basic

            - name: Test and build Android
              working-directory: android
              run: >-
                  gradle --no-daemon test :app:assembleRelease -PcoopUrl="$COOP_URL"
                  -PrunAnalyticsUrl="$RUN_ANALYTICS_URL" -PcloudSaveUrl="$CLOUD_SAVE_URL"
                  -PgameSiteUrl="$GAME_SITE_URL"

            - name: Sign and verify the APK
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: python3 scripts/android/sign-apk.py --version "$VERSION"

            # How to install it and use in-app updates, for the release's notes. The website's part
            # only when the app keeps to it.
            - run: |
                  website='/^<!-- website[: ].*-->$/,/^<!-- \/website -->$/d'
                  if [ -n "$GAME_SITE_URL" ]; then website='/^<!-- \/*website[: ].*-->$/d'; fi
                  sed -e "s/<version>/$VERSION/g" -e "$website" android/release-notes.md | cat -s \
                      > release/android-notes.md

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: android-release
                  path: |
                      release/Run-Escape-*-android.apk
                      release/android-notes.md
                  if-no-files-found: error
                  retention-days: 1
                  compression-level: 0

    # Apart from the build, so the token that can write to releases never runs npm packages
    publish:
        needs: [check, build, android]
        if: >-
            always() && needs.check.result == 'success' && needs.build.result == 'success' &&
            (needs.android.result == 'success' || needs.android.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: desktop-release
                  path: release

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: needs.android.result == 'success'
              with:
                  name: android-release
                  path: release

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ needs.check.outputs.version }}
                  DRAFT_EXISTS: ${{ needs.check.outputs.draft }}
                  ANDROID_BUILT: ${{ needs.android.result == 'success' }}
              run: |
                  win_zip="Run-Escape-$VERSION-win-x64.zip"
                  apk="Run-Escape-$VERSION-android.apk"
                  files=("release/$win_zip" release/game-*.zip release/cache-*.bin
                      release/game-manifest.json)
                  # Links at the top, as the cache's chunks bury these among the assets. A draft's
                  # links can't be tried, as the tag only exists once it's published, so they're the
                  # names uploaded: a renamed file fails the upload rather than leaving a dead link.
                  base="https://github.com/$GH_REPO/releases/download/v$VERSION"
                  downloads="- Windows: [$win_zip]($base/$win_zip)"
                  android_notes=
                  if [ "$ANDROID_BUILT" = true ]; then
                      files+=("release/$apk")
                      # Beside the link, as a player who taps it may never scroll to the notes
                      downloads+=$'\n'"- Android: [$apk]($base/$apk). If you have the app, install"
                      downloads+=" this over it: uninstalling it first deletes your progress."
                      android_notes=$'\n\n'$(cat release/android-notes.md)
                  fi
                  # A file of its own, so the artifact's notes never get these twice
                  printf '### Downloads\n\n%s\n\n%s%s\n' "$downloads" "$(cat release/notes.md)" \
                      "$android_notes" > release/draft-notes.md
                  if [ "$DRAFT_EXISTS" = true ]; then
                      gh release upload "v$VERSION" "${files[@]}" --clobber
                      gh release edit "v$VERSION" --notes-file release/draft-notes.md \
                          --target "$GITHUB_SHA"
                  else
                      gh release create "v$VERSION" "${files[@]}" --draft \
                          --title "Run Escape $VERSION" --notes-file release/draft-notes.md \
                          --target "$GITHUB_SHA"
                  fi
