# Checks a pull request: the type check and the tests, without the game's
# cache (generator.test.ts skips its long map check without it). The release
# workflow (release.yml) runs the tests with the cache, on Windows.
name: Check

on:
    pull_request:
    push:
        branches: [main]

permissions: {}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile
            - run: bun install --cwd server/cloudflare --frozen-lockfile

            - run: bun run tsc --noEmit -p .

            - run: bun run test
