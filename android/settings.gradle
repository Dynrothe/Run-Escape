pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // GeckoView: not published to Maven Central or Google's repo, only Mozilla's own.
        maven { url 'https://maven.mozilla.org/maven2/' }
    }
}
rootProject.name = 'RunEscape'
include ':app'
