import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def gamePackage = new JsonSlurper().parse(rootProject.file('../package.json'))
def versionParts = (gamePackage.version as String) =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionParts.matches()) {
    throw new GradleException('Android releases need a major.minor.patch game version.')
}
def (major, minor, patch) = (1..3).collect { versionParts.group(it).toInteger() }
if (minor > 999 || patch > 999) {
    throw new GradleException('Android version components must be less than 1000.')
}
// 0.24.1 -> 240010, leaving room for an Android rebuild of a game release.
def androidRevision = providers.gradleProperty('androidRevision').getOrElse('0').toInteger()
if (androidRevision < 0 || androidRevision > 9) {
    throw new GradleException('androidRevision must be between 0 and 9.')
}
def gameVersionCode = major * 10000000L + minor * 10000L + patch * 10L + androidRevision
if (gameVersionCode < 1 || gameVersionCode > 2100000000L) {
    throw new GradleException('The game version exceeds the Android versionCode range.')
}
def coopUrl = providers.gradleProperty('coopUrl').getOrElse('').trim()
if (!coopUrl.isEmpty()) {
    URI relay
    try {
        relay = new URI(coopUrl)
    } catch (Exception exception) {
        throw new GradleException('coopUrl must be a secure WebSocket URL.', exception)
    }
    if (relay.scheme != 'wss' || !relay.host || relay.userInfo != null
            || relay.rawQuery != null || relay.rawFragment != null
            || (relay.port != -1 && (relay.port < 1 || relay.port > 65535))) {
        throw new GradleException('coopUrl must be a wss URL with a valid port and no credentials, query or fragment.')
    }
}
// The run collector the web build was given as VITE_RUN_ANALYTICS_URL (src/util/runAnalyticsUrl.ts)
def runAnalyticsUrl = providers.gradleProperty('runAnalyticsUrl').getOrElse('').trim()
if (!runAnalyticsUrl.isEmpty()) {
    URI collector
    try {
        collector = new URI(runAnalyticsUrl)
    } catch (Exception exception) {
        throw new GradleException('runAnalyticsUrl must be an https URL.', exception)
    }
    if (collector.scheme != 'https' || !collector.host || collector.userInfo != null
            || collector.rawQuery != null || collector.rawFragment != null
            || collector.rawPath != '/v1/runs'
            || (collector.port != -1 && (collector.port < 1 || collector.port > 65535))) {
        throw new GradleException('runAnalyticsUrl must be an https URL ending in /v1/runs, with no credentials, query or fragment.')
    }
}
// The cloud-save Worker the web build was given as VITE_CLOUD_SAVE_URL (src/util/cloudSaveUrl.ts)
def cloudSaveUrl = providers.gradleProperty('cloudSaveUrl').getOrElse('').trim()
if (!cloudSaveUrl.isEmpty()) {
    URI saves
    try {
        saves = new URI(cloudSaveUrl)
    } catch (Exception exception) {
        throw new GradleException('cloudSaveUrl must be an https URL.', exception)
    }
    if (saves.scheme != 'https' || !saves.host || saves.userInfo != null
            || saves.rawQuery != null || saves.rawFragment != null
            || !(saves.rawPath in [null, '', '/'])
            || (saves.port != -1 && (saves.port < 1 || saves.port > 65535))) {
        throw new GradleException('cloudSaveUrl must be an https origin, with no path, credentials, query or fragment.')
    }
}
// The website whose build the app keeps to (SiteUpdater.java), as the Windows app's GAME_SITE_URL.
// Without it, the app plays its own game and takes GitHub's releases.
def gameSiteUrl = providers.gradleProperty('gameSiteUrl').getOrElse('').trim()
if (!gameSiteUrl.isEmpty()) {
    URI site
    try {
        site = new URI(gameSiteUrl)
    } catch (Exception exception) {
        throw new GradleException('gameSiteUrl must be an https URL.', exception)
    }
    if (site.scheme != 'https' || !site.host || site.userInfo != null
            || site.rawQuery != null || site.rawFragment != null
            || (site.port != -1 && (site.port < 1 || site.port > 65535))) {
        throw new GradleException('gameSiteUrl must be an https URL with no credentials, query or fragment.')
    }
}

def signingKeys = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
                   'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def releaseSigning = signingKeys.collectEntries { [(it): System.getenv(it)] }
def hasSigning = signingKeys.every { releaseSigning[it] }
if (!hasSigning && signingKeys.any { releaseSigning[it] }) {
    throw new GradleException('All four ANDROID_KEYSTORE_* / ANDROID_KEY_* signing variables are required.')
}

android {
    namespace 'io.jere.run_escape'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        // Android players' saves belong to this: never change it (see Android in docs/DEVELOPMENT.md)
        applicationId 'io.jere.run_escape'
        minSdk 26
        targetSdk 35
        versionCode gameVersionCode.toInteger()
        versionName gamePackage.version
        buildConfigField 'String', 'COOP_URL', groovy.json.JsonOutput.toJson(coopUrl)
        buildConfigField 'String', 'RUN_ANALYTICS_URL', groovy.json.JsonOutput.toJson(runAnalyticsUrl)
        buildConfigField 'String', 'CLOUD_SAVE_URL', groovy.json.JsonOutput.toJson(cloudSaveUrl)
        buildConfigField 'String', 'GAME_SITE_URL', groovy.json.JsonOutput.toJson(gameSiteUrl)
    }

    buildFeatures {
        buildConfig true
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.ANDROID_KEYSTORE_PATH)
                storePassword releaseSigning.ANDROID_KEYSTORE_PASSWORD
                keyAlias releaseSigning.ANDROID_KEY_ALIAS
                keyPassword releaseSigning.ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The slim cache's chunks (caches/chunks/*.bin) are compressed already. A match is on the
        // end of a file's name.
        noCompress += ['bin', 'wasm']
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.18.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
