name = "run-escape-analytics"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[vars]
PUBLIC_LEADERBOARD = "false"
# Comma-separated game origins; add your web game's origin before deploying.
ALLOWED_ORIGINS = "https://run-escape.invalid"
RAW_RETENTION_DAYS = "30"
DAILY_RETENTION_DAYS = "365"

[[d1_databases]]
binding = "DB"
database_name = "run-escape-analytics"
# Replace with the id printed by `wrangler d1 create run-escape-analytics`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "11501"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "QUERY_LIMITER"
namespace_id = "11502"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["17 * * * *"]
