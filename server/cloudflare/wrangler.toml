name = "run-escape-coop"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "on": rooms take players whatever maps they've unlocked (MULTIPLAYER_ANY_MAP)
MULTIPLAYER_ANY_MAP = "off"

# Optional run outcomes (see README.md). Uncomment to collect them in Analytics Engine.
# [[analytics_engine_datasets]]
# binding = "RUN_METRICS"
# dataset = "run_escape_coop_runs"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]
