name = "run-escape-coop"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "on": rooms take players whatever maps they've unlocked (MULTIPLAYER_ANY_MAP)
MULTIPLAYER_ANY_MAP = "off"
# "end": a run whose host the run checks catch ends; otherwise it's only logged
MULTIPLAYER_RUN_CHECKS = "log"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]
